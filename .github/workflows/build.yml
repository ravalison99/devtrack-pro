name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Tests & SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Historique complet nécessaire à SonarQube

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, gd, pdo_sqlite, sqlite3
          coverage: pcov

      - name: Installer les dépendances Composer
        uses: ramsey/composer-install@v3

      - name: Préparer l'environnement Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer les tests avec couverture
        run: vendor/bin/phpunit --coverage-clover coverage.xml --log-junit junit.xml

      - name: Cache SonarQube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyse SonarQube + Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  livraison:
    name: Paquet de production
    needs: qualite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Installer les dépendances de production
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-dev --optimize-autoloader

      - name: Créer l'archive
        run: tar --exclude=.git --exclude=.github --exclude=tests --exclude=.env -czf "$RUNNER_TEMP/devtrack-pro.tar.gz" .

      - name: Publier l'archive
        uses: actions/upload-artifact@v4
        with:
          name: devtrack-pro-${{ github.sha }}
          path: ${{ runner.temp }}/devtrack-pro.tar.gz
          retention-days: 14
