sonar.projectKey=ravalison99_devtrack-pro
sonar.organization=ravalison99
sonar.projectName=devtrack-pro

# Code analysé : uniquement le code du projet (pas vendor/, storage/, public/, bootstrap/cache…)
sonar.sources=app,resources,routes,database
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Rapports produits par PHPUnit dans la CI (voir .github/workflows/build.yml)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

# Vues, routes et migrations ne sont pas mesurables par PHPUnit : exclues du calcul de couverture uniquement
sonar.coverage.exclusions=resources/**,routes/**,database/**
